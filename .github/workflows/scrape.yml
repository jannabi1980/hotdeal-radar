name: Auto Hotdeal Scraper
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi beautifulsoup4
      - run: python scraper.py
      - run: |
          git config user.name "Hotdeal Bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "update [skip ci]" && git push)
