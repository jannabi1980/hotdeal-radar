name: Auto Hotdeal Scraper

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install curl_cffi beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push data.json
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Hotdeal Bot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update hotdeals [skip ci]" && git push)
