<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOTDEAL RADAR - 실시간 핫딜 전광판</title>
  <meta name="description" content="뽐뿌, 클리앙, 루리웹, 딜바다 등 주요 커뮤니티의 실시간 핫딜을 한눈에 모아보는 전광판">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HOTDEAL RADAR - 실시간 핫딜 전광판">
  <meta property="og:description" content="뽐뿌, 클리앙, 루리웹, 딜바다 등 주요 커뮤니티의 실시간 핫딜을 한눈에 모아보는 전광판">

  <style>
    :root {
      --bg-main: #f8f9fa;
      --bg-panel: #ffffff;
      --bg-hover: #f1f3f5;
      --text-main: #111827;
      --text-muted: #6b7280;
      /* 방문한 글도 선명하고 읽기 편한 색상으로 조정 */
      --text-visited: #64748b;
      --border: #e5e7eb;
      --btn-active-bg: #111827;
      --btn-active-text: #ffffff;
      --highlight-bg: #fef9c3;
      --highlight-border: #fde047;
      --price-text: #111827;
      --ship-bg: #f3f4f6;
      --ship-text: #374151;
    }

    body.dark {
      --bg-main: #121316;
      --bg-panel: #1a1c20;
      --bg-hover: #24272d;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-visited: #94a3b8;
      --border: #2a2d35;
      --btn-active-bg: #ffffff;
      --btn-active-text: #111827;
      --highlight-bg: rgba(250, 204, 21, 0.14);
      --highlight-border: rgba(250, 204, 21, 0.4);
      --price-text: #ffffff;
      --ship-bg: #2b303c;
      --ship-text: #d1d5db;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.15s, color 0.15s;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 14px 50px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand .status {
      font-size: 12px;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: flex-end;
    }

    .search-box { width: 210px; }

    .search-box input {
      width: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .search-box input:focus { border-color: var(--text-main); }

    .btn-ctrl {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.12s;
    }

    .btn-ctrl:hover { background: var(--bg-hover); }

    .btn-ctrl.active {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
      border-color: var(--btn-active-bg);
    }

    .drawer {
      display: none;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      gap: 12px;
      flex-direction: column;
    }

    .drawer.open { display: flex; }

    .drawer-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .drawer-label { font-weight: 700; min-width: 125px; }

    .drawer-input {
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      width: 150px;
    }

    .user-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 12px;
    }

    .user-tag button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
    }

    .keyword-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 10px;
    }

    .keyword-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .keyword-bar::-webkit-scrollbar { display: none; }

    .keyword-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      margin-right: 2px;
    }

    .kw-chip {
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .kw-chip:hover { background: var(--bg-hover); }

    .kw-chip.active {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
      border-color: var(--btn-active-bg);
    }

    .btn-reset {
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-reset:hover {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
      border-color: var(--btn-active-bg);
    }

    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
    }

    .tab-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tab-btn .key-hint {
      font-size: 10px;
      opacity: 0.6;
      padding: 0 4px;
      border-radius: 3px;
      border: 1px solid currentColor;
    }

    .tab-btn.active {
      background: var(--btn-active-bg);
      border-color: var(--btn-active-bg);
      color: var(--btn-active-text);
    }

    .quick-filters {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .board-list {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .post-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text-main);
      gap: 10px;
      transition: background 0.1s;
    }

    .post-row:last-child { border-bottom: none; }
    .post-row:hover { background: var(--bg-hover); }

    .post-row.highlighted { background: var(--highlight-bg); }

    .post-row:visited .post-title,
    .post-row.visited .post-title {
      color: var(--text-visited);
    }

    .post-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .site-icon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .pin-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid var(--highlight-border);
      white-space: nowrap;
    }

    .post-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    .post-right {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tag-ship {
      font-size: 11px;
      font-weight: 600;
      background: var(--ship-bg);
      color: var(--ship-text);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .tag-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--price-text);
      font-variant-numeric: tabular-nums;
    }

    .tag-time {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 48px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .more-wrap {
      margin-top: 12px;
      text-align: center;
    }

    .btn-more {
      width: 100%;
      padding: 11px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-more:hover { background: var(--bg-hover); }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      .search-box { width: 100%; }
      .controls { width: 100%; justify-content: space-between; }
      .key-hint { display: none; }
      .post-row { padding: 10px; }
      .tag-time { min-width: 40px; font-size: 11px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <h1>HOTDEAL RADAR</h1>
      <span class="status" id="updateTime">동기화 중...</span>
    </div>
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="핫딜 검색 (단축키 / )" aria-label="핫딜 검색">
      </div>
      <button class="btn-ctrl" id="drawerBtn" title="관심 형광펜 및 제외 키워드 설정">⚙️ 내 키워드</button>
      <button class="btn-ctrl" id="themeBtn" title="화이트 / 다크 테마 전환">🌙 다크</button>
      <button class="btn-ctrl" id="refreshBtn" title="새로고침 (단축키 R)">↻ 갱신</button>
    </div>
  </header>

  <section class="drawer" id="keywordDrawer">
    <div class="drawer-row">
      <span class="drawer-label">🖍️ 관심 형광펜 (상단고정)</span>
      <input type="text" class="drawer-input" id="favInput" placeholder="예: 생수, 모니터 (Enter)">
      <div id="favList" style="display:flex; gap:5px; flex-wrap:wrap;"></div>
    </div>
    <div class="drawer-row">
      <span class="drawer-label">🚫 제외 키워드 (숨김뮤트)</span>
      <input type="text" class="drawer-input" id="muteInput" placeholder="예: 게임, 요금제 (Enter)">
      <div id="muteList" style="display:flex; gap:5px; flex-wrap:wrap;"></div>
    </div>
  </section>

  <div class="keyword-wrap">
    <div class="keyword-bar" id="keywordBar">
      <span class="keyword-label">🔥 인기</span>
    </div>
    <button class="btn-reset" id="resetBtn" title="선택된 키워드 및 필터 전체 해제">↺ 전체보기</button>
  </div>

  <div class="nav-bar">
    <nav class="tabs" id="categoryTabs">
      <button class="tab-btn active" data-cat="ALL">전체 <span class="key-hint">1</span></button>
      <button class="tab-btn" data-cat="전자/PC">디지털/가전 <span class="key-hint">2</span></button>
      <button class="tab-btn" data-cat="식품/생필품">식품/생필품 <span class="key-hint">3</span></button>
      <button class="tab-btn" data-cat="패션/의류">패션/의류 <span class="key-hint">4</span></button>
      <button class="tab-btn" data-cat="상품권/기타">상품권/기타 <span class="key-hint">5</span></button>
    </nav>

    <div class="quick-filters">
      <button class="btn-ctrl" id="filterFreeShip">🚚 무료배송만</button>
      <button class="btn-ctrl" id="filterUnder10k">🪙 1만 원 이하</button>
      <button class="btn-ctrl" id="filterUnread">👁️ 안 읽은 딜만</button>
    </div>
  </div>

  <main class="board-list" id="boardList"></main>

  <div class="more-wrap" id="moreWrap" style="display:none;">
    <button class="btn-more" id="moreBtn">+ 지난 핫딜 더보기</button>
  </div>
</div>

<script>
  const DATA_URL = "https://cdn.jsdelivr.net/gh/jannabi1980/hotdeal-radar@main/data.json";
  const RAW_URL = "https://raw.githubusercontent.com/jannabi1980/hotdeal-radar/main/data.json";
  const INITIAL_LIMIT = 80;

  const SITE_DOMAINS = {
    "뽐뿌": "www.ppomppu.co.kr",
    "이토랜드": "www.etoland.co.kr",
    "클리앙": "www.clien.net",
    "루리웹": "bbs.ruliweb.com",
    "딜바다": "www.dealbada.com",
    "어미새": "eomisae.co.kr",
    "퀘이사존": "quasarzone.com",
    "아카라이브": "arca.live"
  };

  let allItems = [];
  let currentCategory = "ALL";
  let currentKeyword = "";
  let onlyFreeShip = false;
  let onlyUnder10k = false;
  let onlyUnread = false;
  let displayLimit = INITIAL_LIMIT;

  let visitedLinks = new Set(JSON.parse(localStorage.getItem("visited_links") || "[]"));
  let favKeywords = JSON.parse(localStorage.getItem("fav_keywords") || "[]");
  let muteKeywords = JSON.parse(localStorage.getItem("mute_keywords") || "[]");

  const themeBtn = document.getElementById("themeBtn");
  if (localStorage.getItem("theme_mode") === "dark") {
    document.body.classList.add("dark");
    themeBtn.textContent = "☀️ 화이트";
    themeBtn.classList.add("active");
  }

  themeBtn.addEventListener("click", () => {
    const isDark = document.body.classList.toggle("dark");
    localStorage.setItem("theme_mode", isDark ? "dark" : "light");
    themeBtn.textContent = isDark ? "☀️ 화이트" : "🌙 다크";
    themeBtn.classList.toggle("active", isDark);
  });

  const drawerBtn = document.getElementById("drawerBtn");
  const keywordDrawer = document.getElementById("keywordDrawer");
  drawerBtn.addEventListener("click", () => {
    const isOpen = keywordDrawer.classList.toggle("open");
    drawerBtn.classList.toggle("active", isOpen);
  });

  function renderUserTags() {
    document.getElementById("favList").innerHTML = favKeywords.map((kw, idx) =>
      `<span class="user-tag">🖍️ ${escapeHtml(kw)} <button onclick="removeFav(${idx})">✕</button></span>`
    ).join("");
    document.getElementById("muteList").innerHTML = muteKeywords.map((kw, idx) =>
      `<span class="user-tag">🚫 ${escapeHtml(kw)} <button onclick="removeMute(${idx})">✕</button></span>`
    ).join("");
  }

  window.removeFav = (idx) => {
    favKeywords.splice(idx, 1);
    localStorage.setItem("fav_keywords", JSON.stringify(favKeywords));
    renderUserTags();
    renderBoard();
  };

  window.removeMute = (idx) => {
    muteKeywords.splice(idx, 1);
    localStorage.setItem("mute_keywords", JSON.stringify(muteKeywords));
    renderUserTags();
    renderBoard();
  };

  document.getElementById("favInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const val = e.target.value.trim();
      if (val && !favKeywords.includes(val)) {
        favKeywords.push(val);
        localStorage.setItem("fav_keywords", JSON.stringify(favKeywords));
        e.target.value = "";
        renderUserTags();
        renderBoard();
      }
    }
  });

  document.getElementById("muteInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const val = e.target.value.trim();
      if (val && !muteKeywords.includes(val)) {
        muteKeywords.push(val);
        localStorage.setItem("mute_keywords", JSON.stringify(muteKeywords));
        e.target.value = "";
        renderUserTags();
        renderBoard();
      }
    }
  });

  function calcRelTime(item) {
    if (item.timestamp) {
      const nowSec = Math.floor(Date.now() / 1000);
      const diff = Math.max(0, nowSec - item.timestamp);
      if (diff < 60) return "방금 전";
      if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
      return `${Math.floor(diff / 86400)}일 전`;
    }
    return "방금 전";
  }

  let currentKeywordsList = [];

  async function loadData() {
    const statusEl = document.getElementById("updateTime");
    statusEl.textContent = "동기화 중...";
    try {
      let data;
      try {
        const res = await fetch(`${DATA_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error("CDN 제한");
        data = await res.json();
      } catch (_) {
        const res2 = await fetch(`${RAW_URL}?t=${Date.now()}`, { cache: "no-store" });
        data = await res2.json();
      }
      statusEl.textContent = `최근 갱신: ${data.updated_at || "완료"}`;
      allItems = data.items || [];
      currentKeywordsList = data.keywords || [];
      renderKeywords();
      renderBoard();
    } catch (err) {
      statusEl.textContent = "데이터 연동 확인 필요";
    }
  }

  function renderKeywords() {
    const bar = document.getElementById("keywordBar");
    bar.innerHTML = `<span class="keyword-label">🔥 인기</span>`;
    currentKeywordsList.forEach(kw => {
      const chip = document.createElement("button");
      chip.className = `kw-chip ${currentKeyword === kw ? "active" : ""}`;
      chip.textContent = `#${kw}`;
      chip.onclick = () => {
        currentKeyword = (currentKeyword === kw) ? "" : kw;
        document.getElementById("searchInput").value = currentKeyword;
        displayLimit = INITIAL_LIMIT;
        renderKeywords();
        renderBoard();
      };
      bar.appendChild(chip);
    });
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    currentCategory = "ALL";
    currentKeyword = "";
    onlyFreeShip = false;
    onlyUnder10k = false;
    onlyUnread = false;
    displayLimit = INITIAL_LIMIT;
    document.getElementById("searchInput").value = "";
    document.querySelectorAll(".tab-btn").forEach((b, i) => b.classList.toggle("active", i === 0));
    document.getElementById("filterFreeShip").classList.remove("active");
    document.getElementById("filterUnder10k").classList.remove("active");
    document.getElementById("filterUnread").classList.remove("active");
    renderKeywords();
    renderBoard();
  });

  function renderBoard() {
    const listEl = document.getElementById("boardList");
    const moreWrap = document.getElementById("moreWrap");
    const moreBtn = document.getElementById("moreBtn");
    const query = document.getElementById("searchInput").value.trim().toLowerCase();

    const filtered = allItems.filter(item => {
      const titleLower = item.title.toLowerCase();
      if (muteKeywords.some(m => titleLower.includes(m.toLowerCase()))) return false;
      if (currentCategory !== "ALL" && item.category !== currentCategory) return false;
      if (query) {
        // '지마켓' 검색 시 'g마켓'도 자동 매칭
        const altQuery = (query === "지마켓") ? "g마켓" : (query === "g마켓" ? "지마켓" : query);
        const match = titleLower.includes(query) || titleLower.includes(altQuery) || item.source.toLowerCase().includes(query);
        if (!match) return false;
      }
      if (onlyFreeShip && !item.free_ship) return false;
      if (onlyUnder10k && (!item.price_num || item.price_num > 10000)) return false;
      if (onlyUnread && visitedLinks.has(item.url)) return false;
      return true;
    });

    // 1순위: 관심 형광펜 키워드, 2순위: 최신 등록시간순(timestamp 내림차순) 정렬
    const sorted = [...filtered].sort((a, b) => {
      const aFav = favKeywords.some(f => a.title.toLowerCase().includes(f.toLowerCase())) ? 1 : 0;
      const bFav = favKeywords.some(f => b.title.toLowerCase().includes(f.toLowerCase())) ? 1 : 0;
      if (bFav !== aFav) return bFav - aFav;
      return (b.timestamp || 0) - (a.timestamp || 0);
    });

    if (sorted.length === 0) {
      listEl.innerHTML = `<div class="empty-state">조건에 맞는 핫딜이 없습니다. 상단 [↺ 전체보기]를 눌러보세요.</div>`;
      moreWrap.style.display = "none";
      return;
    }

    const visibleItems = sorted.slice(0, displayLimit);

    listEl.innerHTML = visibleItems.map(item => {
      const isVisited = visitedLinks.has(item.url) ? "visited" : "";
      const matchedFav = favKeywords.find(f => item.title.toLowerCase().includes(f.toLowerCase()));
      const isHighlighted = matchedFav ? "highlighted" : "";
      const domain = SITE_DOMAINS[item.source] || "google.com";
      const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
      const relTime = calcRelTime(item);

      return `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="post-row ${isVisited} ${isHighlighted}" data-url="${item.url}">
          <div class="post-left">
            <img src="${iconUrl}" alt="${escapeHtml(item.source)}" title="${escapeHtml(item.source)}" class="site-icon" loading="lazy">
            ${matchedFav ? `<span class="pin-badge">★ ${escapeHtml(matchedFav)}</span>` : ""}
            <span class="post-title">${escapeHtml(item.title)}</span>
          </div>
          <div class="post-right">
            ${item.free_ship ? `<span class="tag-ship">무배</span>` : ""}
            ${item.price_str ? `<span class="tag-price">${escapeHtml(item.price_str)}</span>` : ""}
            <span class="tag-time">${escapeHtml(relTime)}</span>
          </div>
        </a>
      `;
    }).join("");

    if (sorted.length > displayLimit) {
      moreWrap.style.display = "block";
      moreBtn.textContent = `+ 지난 핫딜 ${sorted.length - displayLimit}개 더보기`;
    } else {
      moreWrap.style.display = "none";
    }

    listEl.querySelectorAll(".post-row").forEach(row => {
      row.addEventListener("click", () => {
        const url = row.getAttribute("data-url");
        visitedLinks.add(url);
        row.classList.add("visited");
        localStorage.setItem("visited_links", JSON.stringify([...visitedLinks].slice(-500)));
      });
    });
  }

  document.getElementById("moreBtn").addEventListener("click", () => {
    displayLimit += 50;
    renderBoard();
  });

  document.getElementById("filterFreeShip").addEventListener("click", (e) => {
    onlyFreeShip = !onlyFreeShip;
    e.currentTarget.classList.toggle("active", onlyFreeShip);
    renderBoard();
  });

  document.getElementById("filterUnder10k").addEventListener("click", (e) => {
    onlyUnder10k = !onlyUnder10k;
    e.currentTarget.classList.toggle("active", onlyUnder10k);
    renderBoard();
  });

  document.getElementById("filterUnread").addEventListener("click", (e) => {
    onlyUnread = !onlyUnread;
    e.currentTarget.classList.toggle("active", onlyUnread);
    renderBoard();
  });

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = btn.getAttribute("data-cat");
      displayLimit = INITIAL_LIMIT;
      renderBoard();
    });
  });

  document.getElementById("searchInput").addEventListener("input", () => {
    displayLimit = INITIAL_LIMIT;
    renderBoard();
  });
  document.getElementById("refreshBtn").addEventListener("click", loadData);

  window.addEventListener("keydown", (e) => {
    if (document.activeElement.tagName === "INPUT") {
      if (e.key === "Escape") document.activeElement.blur();
      return;
    }
    const tabs = document.querySelectorAll(".tab-btn");
    if (e.key >= "1" && e.key <= String(tabs.length)) {
      tabs[Number(e.key) - 1].click();
    } else if (e.key === "/") {
      e.preventDefault();
      document.getElementById("searchInput").focus();
    } else if (e.key.toLowerCase() === "r") {
      loadData();
    }
  });

  renderUserTags();
  loadData();
</script>
</body>
</html>
